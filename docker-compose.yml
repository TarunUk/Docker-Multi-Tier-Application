version: "3.8"

services:

  frontend:
    build: ./frontend
    ports:
      - "3010:80"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multitierdb
    ports:
      - "3309:3306"